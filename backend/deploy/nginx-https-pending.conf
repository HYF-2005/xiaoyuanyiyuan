# Keep business APIs closed until the domain is ready for WeChat publication.
# Nginx 虚拟主机区块；历史部署模板不说明当前域名/服务器仍有效。
server {
    # 监听 HTTP；待 HTTPS 模板会重定向 HTTPS。
    listen 80;
    # 按访问域名/IP 匹配此服务块，不负责 DNS 解析。
    server_name api.xyyy.online;

    # 证书申请挑战文件入口，由证书工具提供文件。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        # 把 HTTP 访问转到 HTTPS。
        return 301 https://$host$request_uri;
    }
}

server {
    # 监听 HTTPS，需下面路径中有可用证书。
    listen 443 ssl;
    server_name api.xyyy.online;
    # 指定证书/私钥，路径由服务器证书签发流程提供。
    ssl_certificate /etc/letsencrypt/live/api.xyyy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xyyy.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 限制代理层请求体大小，要与 Spring 上传限制配合。
    client_max_body_size 6m;

    # 只代理健康检查到 Java 服务，不能用它代表所有业务已上线。
    location = /api/health {
        # 将匹配的请求转发到本机后端，保留原路径。
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
    }

    location / {
        default_type text/plain;
        # 当前模板有意关闭其他业务接口，返回 503；不是已发布的完整后端网关。
        return 503 "Campus Help backend is installed. Business API publication is pending.\n";
    }
}

server {
    listen 80;
    server_name 106.52.127.171;
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
    }
    location / { return 503; }
}
