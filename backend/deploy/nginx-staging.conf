# HTTPS domain is required before enabling public login and order endpoints.
server {
    listen 80;
    server_name api.xyyy.online 106.52.127.171;
    client_max_body_size 6m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
    }

    location / {
        default_type text/plain;
        return 503 "Campus Help backend is installed. HTTPS domain setup is pending.\n";
    }
}
